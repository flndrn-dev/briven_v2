name: PostgreSQL branch and vector durability acceptance

on:
  push:
    branches: ['postgres-durability-*']
    paths:
      - tests/acceptance/postgres-durability/**
      - .github/workflows/postgres-durability.yml
      - infra/private-back-room/start-private.sh
      - infra/private-back-room/test_controller_restart.py
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify test runner and fault guards
        run: |
          node --version
          python3 -B -m unittest discover -s tests/acceptance/postgres-durability -p test_guards.py
          python3 -B infra/private-back-room/test_controller_restart.py
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/acceptance/postgres-durability
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run actual isolated engine failure and durability matrix
        run: python3 -B tests/acceptance/postgres-durability/run.py
      - name: Preserve redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-durability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/briven-durability-*/evidence.jsonl
            ${{ runner.temp }}/briven-durability-*/summary.json
          if-no-files-found: error
          retention-days: 30
