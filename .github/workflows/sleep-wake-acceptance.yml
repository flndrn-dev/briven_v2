name: Database sleep wake immutable release acceptance
on:
  push:
    branches: ['sleep-wake-acceptance-*']
    paths:
      - tests/acceptance/sleep-wake/**
      - .github/workflows/sleep-wake-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify fault guards and install locked SQL client
        run: |
          python3 -B -m unittest discover -s tests/acceptance/postgres-durability -p test_guards.py
          python3 -B -m unittest discover -s tests/acceptance/sleep-wake -p test_guards.py
          python3 -B infra/private-back-room/test_controller_restart.py
          python3 -B infra/private-back-room/compute-resource-host.test.py
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/acceptance/postgres-durability
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Real scheduler restart transition and TLS acceptance
        run: python3 -B tests/acceptance/sleep-wake/run.py
      - name: Preserve redacted acceptance and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sleep-wake-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/briven-durability-*/evidence.jsonl
            ${{ runner.temp }}/briven-durability-*/summary.json
          if-no-files-found: error
          retention-days: 30
